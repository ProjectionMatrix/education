<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock-In & Timecard System</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --border: #e2e8f0;
            --success: #16a34a;
            --danger: #dc2626;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--surface);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 24px;
        }

        .nav-tabs {
            display: flex;
            gap: 8px;
            border-bottom: 2px solid var(--border);
            margin-bottom: 24px;
        }

        .tab-btn {
            padding: 12px 24px;
            border: none;
            background: none;
            font-size: 16px;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
        }

        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Keypad Styles */
        .keypad-container {
            max-width: 320px;
            margin: 0 auto;
            text-align: center;
        }

        .event-banner {
            background: #e0e7ff;
            color: #3730a3;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 20px;
            border: 1px solid #c7d2fe;
        }

        .pin-display {
            width: 100%;
            height: 50px;
            font-size: 32px;
            letter-spacing: 12px;
            text-align: center;
            margin-bottom: 20px;
            border: 2px solid var(--border);
            border-radius: 8px;
            background: #f1f5f9;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .key-btn {
            padding: 20px;
            font-size: 20px;
            font-weight: bold;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            cursor: pointer;
            transition: background 0.2s;
        }

        .key-btn:active { background: #e2e8f0; }

        /* Form Controls */
        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn:hover { background: var(--primary-dark); }
        .btn-danger { background: var(--danger); }

        /* Signature Canvas */
        canvas {
            border: 2px dashed var(--border);
            border-radius: 8px;
            width: 100%;
            height: 150px;
            touch-action: none;
            background: #fafafa;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 8px;
            width: 90%;
            max-width: 450px;
        }

        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }

        th, td {
            border: 1px solid var(--border);
            padding: 10px;
            text-align: left;
        }

        th { background: #f1f5f9; }

        /* Print Styles */
        @media print {
            body { background: white; padding: 0; }
            .nav-tabs, .no-print { display: none !important; }
            .container { box-shadow: none; border: none; width: 100%; max-width: 100%; }
            .tab-content { display: block !important; }
            #kiosk-tab, #manager-tab { display: none !important; }
            .sig-img { max-height: 40px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-tabs no-print">
        <button class="tab-btn active" onclick="switchTab('kiosk')">Timecard Kiosk</button>
        <button class="tab-btn" onclick="switchTab('manager')">Manager Dashboard</button>
        <button class="tab-btn" onclick="switchTab('invoice')">Invoices</button>
    </div>

    <div id="kiosk-tab" class="tab-content active">
        <div class="keypad-container">
            <div id="active-event-display" class="event-banner">No Active Event Set</div>
            <h2>Enter Your 4-Digit PIN</h2>
            <input type="password" id="pin-input" class="pin-display" readonly maxlength="4">
            <div class="keypad">
                <button class="key-btn" onclick="appendPin('1')">1</button>
                <button class="key-btn" onclick="appendPin('2')">2</button>
                <button class="key-btn" onclick="appendPin('3')">3</button>
                <button class="key-btn" onclick="appendPin('4')">4</button>
                <button class="key-btn" onclick="appendPin('5')">5</button>
                <button class="key-btn" onclick="appendPin('6')">6</button>
                <button class="key-btn" onclick="appendPin('7')">7</button>
                <button class="key-btn" onclick="appendPin('8')">8</button>
                <button class="key-btn" onclick="appendPin('9')">9</button>
                <button class="key-btn btn-danger" onclick="clearPin()">C</button>
                <button class="key-btn" onclick="appendPin('0')">0</button>
                <button class="key-btn btn" onclick="processPin()">OK</button>
            </div>
            <p id="kiosk-msg" style="margin-top:15px; font-weight:bold;"></p>
        </div>
    </div>

    <div id="manager-tab" class="tab-content">
        <div id="manager-auth">
            <h3>Manager Verification Required</h3>
            <div class="form-group">
                <input type="password" id="manager-pass" placeholder="Enter Manager Password (default: 1234)">
            </div>
            <button class="btn" onclick="unlockManager()">Login</button>
        </div>

        <div id="manager-panel" style="display: none;">
            <h3>Set Kiosk Event ID</h3>
            <form onsubmit="setEventId(event)" style="display:flex; gap:10px; margin-bottom: 24px;">
                <input type="text" id="new-event-id" placeholder="Enter Event ID (e.g. EVT-101)" required>
                <button class="btn" type="submit">Set Event ID</button>
            </form>
            <p style="margin-top: -15px; margin-bottom: 24px; color: #64748b;">
                Current Active Event ID: <strong id="manager-current-event">None</strong>
            </p>

            <hr style="margin: 24px 0; border: none; border-top: 1px solid var(--border);">

            <h3>Register New Personnel</h3>
            <form onsubmit="registerUser(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="reg-name" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="reg-email" required>
                </div>
                <div class="form-group">
                    <label>Cell Phone</label>
                    <input type="tel" id="reg-phone" required>
                </div>
                <button class="btn" type="submit">Register User</button>
            </form>

            <h3 style="margin-top:30px;">Registered Personnel</h3>
            <table id="user-table">
                <thead>
                    <tr>
                        <th>PIN</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div id="invoice-tab" class="tab-content">
        <div class="no-print" style="margin-bottom: 20px; display:flex; gap:10px; align-items:center;">
            <button class="btn" onclick="window.print()">Print Invoice (PDF)</button>
        </div>

        <div id="invoice-render-area"></div>
    </div>
</div>

<div id="sig-modal" class="modal">
    <div class="modal-content">
        <h3>Clock Out Signature Required</h3>
        <p>Please sign with your finger/mouse below to complete clock out.</p>
        <canvas id="sig-canvas"></canvas>
        <div style="margin-top: 15px; display:flex; justify-content:space-between;">
            <button class="btn btn-danger" onclick="clearCanvas()">Clear Signature</button>
            <button class="btn" onclick="confirmClockOut()">Submit Clock Out</button>
        </div>
    </div>
</div>

<script>
    const HOURLY_RATE = 25;
    const MIN_HOURS = 4;

    let users = JSON.parse(localStorage.getItem('sys_users')) || [];
    let currentEventId = localStorage.getItem('sys_active_event') || '';
    let timeLogs = JSON.parse(localStorage.getItem('sys_logs')) || [];
    let activeClockOutUser = null;

    function init() {
        updateEventUI();
        renderUserTable();
        initCanvas();
    }

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        
        document.getElementById(`${tabId}-tab`).classList.add('active');
        event.currentTarget.classList.add('active');

        if(tabId === 'invoice') renderInvoices();
    }

    // --- Keypad & Clock Logic ---
    function appendPin(num) {
        const input = document.getElementById('pin-input');
        if (input.value.length < 4) input.value += num;
    }

    function clearPin() {
        document.getElementById('pin-input').value = '';
    }

    function processPin() {
        const pin = document.getElementById('pin-input').value;
        const msg = document.getElementById('kiosk-msg');

        if(!currentEventId) {
            msg.style.color = 'red';
            msg.innerText = 'Cannot clock in: No Event ID set by Manager.';
            clearPin();
            return;
        }

        const user = users.find(u => u.pin === pin);
        if (!user) {
            msg.style.color = 'red';
            msg.innerText = 'Invalid PIN.';
            clearPin();
            return;
        }

        const activeLog = timeLogs.find(l => l.pin === pin && !l.clockOut);

        if (!activeLog) {
            const newLog = {
                id: Date.now(),
                pin: user.pin,
                userName: user.name,
                eventId: currentEventId,
                clockIn: new Date().toISOString(),
                clockOut: null,
                signature: null
            };
            timeLogs.push(newLog);
            saveLogs();
            msg.style.color = 'green';
            msg.innerText = `Welcome, ${user.name}. Clocked IN for Event ${currentEventId}`;
            clearPin();
        } else {
            activeClockOutUser = activeLog;
            document.getElementById('sig-modal').style.display = 'flex';
            clearPin();
        }
    }

    // --- Manager Logic ---
    function unlockManager() {
        const pass = document.getElementById('manager-pass').value;
        if(pass === '1234') {
            document.getElementById('manager-auth').style.display = 'none';
            document.getElementById('manager-panel').style.display = 'block';
        } else {
            alert('Incorrect manager password.');
        }
    }

    function setEventId(e) {
        e.preventDefault();
        const eventInput = document.getElementById('new-event-id').value.trim().toUpperCase();
        if(eventInput) {
            currentEventId = eventInput;
            localStorage.setItem('sys_active_event', currentEventId);
            updateEventUI();
            alert(`Active Event ID set to: ${currentEventId}`);
            e.target.reset();
        }
    }

    function updateEventUI() {
        const kioskDisplay = document.getElementById('active-event-display');
        const managerDisplay = document.getElementById('manager-current-event');

        if (currentEventId) {
            kioskDisplay.innerText = `Event ID: ${currentEventId}`;
            managerDisplay.innerText = currentEventId;
        } else {
            kioskDisplay.innerText = 'No Active Event Set';
            managerDisplay.innerText = 'None';
        }
    }

    function registerUser(e) {
        e.preventDefault();
        
        let pin;
        do {
            pin = Math.floor(1000 + Math.random() * 9000).toString();
        } while (users.some(u => u.pin === pin));

        const newUser = {
            pin: pin,
            name: document.getElementById('reg-name').value,
            email: document.getElementById('reg-email').value,
            phone: document.getElementById('reg-phone').value
        };

        users.push(newUser);
        localStorage.setItem('sys_users', JSON.stringify(users));
        renderUserTable();
        
        alert(`User created successfully!\nAssigned PIN: ${pin}`);
        e.target.reset();
    }

    function renderUserTable() {
        const tbody = document.querySelector('#user-table tbody');
        tbody.innerHTML = users.map(u => {
            const isClockedIn = timeLogs.some(l => l.pin === u.pin && !l.clockOut);
            return `
                <tr>
                    <td><strong>${u.pin}</strong></td>
                    <td>${u.name}</td>
                    <td>${u.email}</td>
                    <td>${u.phone}</td>
                    <td style="color:${isClockedIn ? 'green':'gray'}; font-weight:bold;">
                        ${isClockedIn ? 'Clocked IN' : 'Clocked OUT'}
                    </td>
                </tr>
            `;
        }).join('');
    }

    // --- Signature Canvas Handling ---
    let canvas, ctx, isDrawing = false;

    function initCanvas() {
        canvas = document.getElementById('sig-canvas');
        ctx = canvas.getContext('2d');
        
        const getPos = e => {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        };

        const startDraw = e => { isDrawing = true; ctx.beginPath(); const pos = getPos(e); ctx.moveTo(pos.x, pos.y); };
        const draw = e => { if(!isDrawing) return; const pos = getPos(e); ctx.lineTo(pos.x, pos.y); ctx.stroke(); };
        const stopDraw = () => isDrawing = false;

        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDraw);
        
        canvas.addEventListener('touchstart', startDraw);
        canvas.addEventListener('touchmove', draw);
        canvas.addEventListener('touchend', stopDraw);
    }

    function clearCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function confirmClockOut() {
        if (!activeClockOutUser) return;

        const sigData = canvas.toDataURL();
        activeClockOutUser.clockOut = new Date().toISOString();
        activeClockOutUser.signature = sigData;

        saveLogs();
        clearCanvas();
        document.getElementById('sig-modal').style.display = 'none';
        
        const msg = document.getElementById('kiosk-msg');
        msg.style.color = 'blue';
        msg.innerText = `Goodbye, ${activeClockOutUser.userName}. Clocked OUT.`;
        
        activeClockOutUser = null;
        renderUserTable();
    }

    // --- Calculations & Invoicing ---
    function calculatePay(clockInStr, clockOutStr) {
        if(!clockOutStr) return { hoursWorked: 0, billableHours: 0, total: 0 };
        
        const start = new Date(clockInStr);
        const end = new Date(clockOutStr);
        const rawHours = (end - start) / (1000 * 60 * 60);
        
        const billableHours = Math.max(rawHours, MIN_HOURS);
        return {
            hoursWorked: rawHours.toFixed(2),
            billableHours: billableHours.toFixed(2),
            total: (billableHours * HOURLY_RATE).toFixed(2)
        };
    }

    function renderInvoices() {
        const container = document.getElementById('invoice-render-area');
        container.innerHTML = '';

        const grouped = {};
        timeLogs.forEach(log => {
            if(!log.clockOut) return;
            if(!grouped[log.eventId]) grouped[log.eventId] = [];
            grouped[log.eventId].push(log);
        });

        if(Object.keys(grouped).length === 0) {
            container.innerHTML = '<p>No completed shifts to invoice.</p>';
            return;
        }

        for (const [evtId, logs] of Object.entries(grouped)) {
            let eventTotal = 0;
            
            let html = `
                <div style="margin-bottom: 40px; page-break-after: auto;">
                    <h2>INVOICE: Event ${evtId}</h2>
                    <p><strong>Rate:</strong> $${HOURLY_RATE}.00/hr | <strong>Terms:</strong> ${MIN_HOURS}-Hour Minimum Shift Guarantee</p>
                    <table>
                        <thead>
                            <tr>
                                <th>Personnel</th>
                                <th>Clock In</th>
                                <th>Clock Out</th>
                                <th>Actual Hrs</th>
                                <th>Billable Hrs</th>
                                <th>Total Pay</th>
                                <th>Signature</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            logs.forEach(log => {
                const pay = calculatePay(log.clockIn, log.clockOut);
                eventTotal += parseFloat(pay.total);

                html += `
                    <tr>
                        <td>${log.userName}</td>
                        <td>${new Date(log.clockIn).toLocaleString()}</td>
                        <td>${new Date(log.clockOut).toLocaleString()}</td>
                        <td>${pay.hoursWorked} hrs</td>
                        <td>${pay.billableHours} hrs</td>
                        <td>$${pay.total}</td>
                        <td><img src="${log.signature}" class="sig-img" style="max-height:30px;"/></td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                    <h3 style="text-align: right; margin-top: 10px;">Event Total: $${eventTotal.toFixed(2)}</h3>
                    <hr style="margin-top: 20px;">
                </div>
            `;
            
            container.innerHTML += html;
        }
    }

    function saveLogs() {
        localStorage.setItem('sys_logs', JSON.stringify(timeLogs));
    }

    init();
</script>
</body>
</html>
