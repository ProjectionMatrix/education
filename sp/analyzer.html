<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Log & Data Workbench</title>
    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e1e;
            --border: #333333;
            --text: #e0e0e0;
            --text-dim: #a0a0a0;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --error: #ef4444;
            --success: #22c55e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace; }
        body { background: var(--bg); color: var(--text); padding: 20px; line-height: 1.4; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 15px; }
        .card-header { font-weight: bold; font-size: 1.1rem; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }

        textarea { width: 100%; height: 220px; background: #000; color: #00ff66; border: 1px solid var(--border); padding: 10px; font-family: monospace; font-size: 0.85rem; resize: vertical; }
        
        .controls { display: flex; gap: 10px; margin-top: 10px; }
        input[type="text"] { background: #000; border: 1px solid var(--border); color: var(--text); padding: 8px 12px; font-family: monospace; flex: 1; }
        button { background: var(--accent); color: white; border: none; padding: 8px 16px; cursor: pointer; font-weight: bold; border-radius: 2px; }
        button:hover { background: var(--accent-hover); }
        button.secondary { background: #444; }
        button.secondary:hover { background: #555; }

        .stats-bar { display: flex; gap: 20px; margin-bottom: 15px; background: var(--surface); border: 1px solid var(--border); padding: 10px 15px; }
        .stat-item { display: flex; flex-direction: column; }
        .stat-label { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; }
        .stat-val { font-size: 1.2rem; font-weight: bold; color: var(--accent); }

        table { width: 100%; border-collapse: collapse; background: var(--surface); font-size: 0.85rem; }
        th, td { border: 1px solid var(--border); padding: 8px; text-align: left; }
        th { background: #2a2a2a; color: var(--text-dim); }
        tr:nth-child(even) { background: #181818; }

        .status { font-size: 0.85rem; margin-top: 5px; color: var(--text-dim); }
    </style>
</head>
<body>

    <h2 style="margin-bottom: 15px;">Universal Log & Data Workbench</h2>

    <div class="grid">
        <!-- INPUT AREA -->
        <div class="card">
            <div class="card-header">
                <span>Raw Input Data</span>
                <button class="secondary" onclick="loadSampleData()">Load Sample JSON</button>
            </div>
            <textarea id="rawData" placeholder="Paste JSON array or plain text lines here..."></textarea>
            <div class="controls">
                <button onclick="parseData()">Parse & Process</button>
                <button class="secondary" onclick="clearAll()">Clear</button>
            </div>
            <div id="parseStatus" class="status">Ready.</div>
        </div>

        <!-- FILTER & QUERY AREA -->
        <div class="card">
            <div class="card-header">Filters & Controls</div>
            <div style="margin-bottom: 15px;">
                <label style="display:block; font-size:0.8rem; color: var(--text-dim); margin-bottom:5px;">Text Search (Case-Insensitive)</label>
                <input type="text" id="searchInput" placeholder="Type to filter..." oninput="applyFilter()">
            </div>
            <div style="margin-bottom: 15px;">
                <label style="display:block; font-size:0.8rem; color: var(--text-dim); margin-bottom:5px;">Field Key Filter (For JSON objects)</label>
                <input type="text" id="keyFilterInput" placeholder="e.g. status=500 or level=ERROR" oninput="applyFilter()">
            </div>
            <div class="controls">
                <button class="secondary" onclick="exportFiltered()">Export Processed JSON</button>
            </div>
        </div>
    </div>

    <!-- METRICS OVERVIEW -->
    <div class="stats-bar">
        <div class="stat-item">
            <span class="stat-label">Total Records</span>
            <span class="stat-val" id="statTotal">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Filtered Matches</span>
            <span class="stat-val" id="statMatches">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Parse Format</span>
            <span class="stat-val" id="statFormat" style="color:var(--text);">None</span>
        </div>
    </div>

    <!-- OUTPUT TABLE -->
    <div class="card" style="overflow-x: auto;">
        <div class="card-header">Processed Output</div>
        <table>
            <thead>
                <tr id="tableHeader">
                    <th>Index</th>
                    <th>Data Content</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="2" style="text-align:center; color: var(--text-dim);">No parsed data available</td></tr>
            </tbody>
        </table>
    </div>

<script>
    let parsedDataset = [];
    let activeFilteredData = [];
    let currentFormat = "TEXT";

    function parseData() {
        const raw = document.getElementById('rawData').value.trim();
        const status = document.getElementById('parseStatus');
        
        if (!raw) {
            status.innerText = "Error: Input is empty.";
            status.style.color = "var(--error)";
            return;
        }

        try {
            // Attempt JSON Parse
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) {
                parsedDataset = parsed;
            } else {
                parsedDataset = [parsed];
            }
            currentFormat = "JSON";
            status.innerText = `Successfully parsed ${parsedDataset.length} JSON record(s).`;
            status.style.color = "var(--success)";
        } catch (e) {
            // Fallback to Line-by-Line Plain Text
            parsedDataset = raw.split('\n').filter(line => line.trim() !== '').map((line, idx) => ({
                line: idx + 1,
                content: line
            }));
            currentFormat = "PLAIN TEXT";
            status.innerText = `Parsed ${parsedDataset.length} line(s) as plain text.`;
            status.style.color = "var(--success)";
        }

        document.getElementById('statFormat').innerText = currentFormat;
        document.getElementById('statTotal').innerText = parsedDataset.length;
        applyFilter();
    }

    function applyFilter() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const keyFilter = document.getElementById('keyFilterInput').value.trim();

        activeFilteredData = parsedDataset.filter(item => {
            // General text search matching
            const itemString = typeof item === 'object' ? JSON.stringify(item).toLowerCase() : String(item).toLowerCase();
            const matchesText = !searchTerm || itemString.includes(searchTerm);

            // Key=Value matching for JSON objects
            let matchesKey = true;
            if (keyFilter && keyFilter.includes('=')) {
                const [targetKey, targetVal] = keyFilter.split('=').map(s => s.trim().toLowerCase());
                if (typeof item === 'object' && item !== null) {
                    const actualVal = String(item[targetKey] || '').toLowerCase();
                    matchesKey = actualVal.includes(targetVal);
                } else {
                    matchesKey = false;
                }
            }

            return matchesText && matchesKey;
        });

        document.getElementById('statMatches').innerText = activeFilteredData.length;
        renderTable();
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        const thead = document.getElementById('tableHeader');
        tbody.innerHTML = '';

        if (activeFilteredData.length === 0) {
            tbody.innerHTML = '<tr><td colspan="10" style="text-align:center; color: var(--text-dim);">No matching records found.</td></tr>';
            return;
        }

        if (currentFormat === "JSON" && typeof activeFilteredData[0] === 'object') {
            // Dynamically generate column headers based on keys of the first object
            const keys = Object.keys(activeFilteredData[0]);
            thead.innerHTML = '<th>#</th>' + keys.map(k => `<th>${escapeHtml(k)}</th>`).join('');

            activeFilteredData.forEach((row, idx) => {
                const cells = keys.map(k => {
                    const val = row[k];
                    const displayVal = typeof val === 'object' ? JSON.stringify(val) : String(val);
                    return `<td>${escapeHtml(displayVal)}</td>`;
                }).join('');
                tbody.innerHTML += `<tr><td>${idx + 1}</td>${cells}</tr>`;
            });
        } else {
            // Render basic text table
            thead.innerHTML = '<th>Line</th><th>Content</th>';
            activeFilteredData.forEach((row, idx) => {
                tbody.innerHTML += `<tr><td>${row.line || idx + 1}</td><td>${escapeHtml(row.content || JSON.stringify(row))}</td></tr>`;
            });
        }
    }

    function loadSampleData() {
        const sample = [
            { "timestamp": "2026-09-06 18:00:12", "level": "INFO", "service": "auth-api", "status": 200, "message": "User login successful" },
            { "timestamp": "2026-09-06 18:01:05", "level": "WARN", "service": "payment-gateway", "status": 408, "message": "Connection timeout on vendor endpoint" },
            { "timestamp": "2026-09-06 18:02:40", "level": "ERROR", "service": "database", "status": 500, "message": "Deadlock detected on transaction ID 9842" },
            { "timestamp": "2026-09-06 18:03:15", "level": "INFO", "service": "auth-api", "status": 200, "message": "Token refreshed" },
            { "timestamp": "2026-09-06 18:04:00", "level": "ERROR", "service": "payment-gateway", "status": 502, "message": "Bad Gateway upstream error" }
        ];
        document.getElementById('rawData').value = JSON.stringify(sample, null, 2);
        parseData();
    }

    function clearAll() {
        document.getElementById('rawData').value = '';
        document.getElementById('searchInput').value = '';
        document.getElementById('keyFilterInput').value = '';
        parsedDataset = [];
        activeFilteredData = [];
        document.getElementById('statTotal').innerText = '0';
        document.getElementById('statMatches').innerText = '0';
        document.getElementById('statFormat').innerText = 'None';
        document.getElementById('parseStatus').innerText = 'Cleared.';
        document.getElementById('parseStatus').style.color = 'var(--text-dim)';
        renderTable();
    }

    function exportFiltered() {
        if (activeFilteredData.length === 0) return;
        const blob = new Blob([JSON.stringify(activeFilteredData, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `filtered_export_${Date.now()}.json`;
        a.click();
        URL.revokeObjectURL(url);
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
</script>
</body>
</html>
