<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Curriculum Library Portal</title>
    <!-- pdf-lib handles client-side PDF compilation with zero backend -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <style>
        :root {
            --primary: #1b365d;
            --accent: #005a9c;
            --bg: #0f172a;
            --panel: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #22c55e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 30px; }
        
        .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; max-width: 1400px; margin: 0 auto; }
        .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 24px; }
        
        h2 { font-size: 1.25rem; color: var(--text); border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .badge { font-size: 0.75rem; background: var(--primary); padding: 4px 8px; border-radius: 4px; text-transform: uppercase; }

        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }
        input, textarea, select { width: 100%; background: #0f172a; border: 1px solid var(--border); border-radius: 6px; padding: 10px; color: var(--text); font-size: 0.9rem; }
        textarea { height: 100px; resize: vertical; }

        button { width: 100%; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        button:hover { background: var(--accent); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid var(--border); }
        th { color: var(--text-muted); text-transform: uppercase; font-size: 0.75rem; }

        .file-link { color: #38bdf8; text-decoration: none; font-weight: 600; }
        .file-link:hover { text-decoration: underline; }
        
        .empty-catalog { color: var(--text-muted); text-align: center; padding: 20px 0; font-style: italic; }
    </style>
</head>
<body>

<div class="layout">
    <!-- 1. ACQUISITION DESK (CUSTOM FRONTEND) -->
    <div class="card">
        <h2>Acquisition Desk <span class="badge">Faculty Portal</span></h2>
        <form id="curriculumForm">
            <div class="form-group">
                <label>Institutional Template</label>
                <select id="template">
                    <option value="NURSING_BSN">BSN Clinical Nursing Curriculum</option>
                    <option value="OPHTHALMIC_TASK">Ophthalmic Surgical Task Trainer</option>
                    <option value="SIM_SCENARIO">High-Fidelity Sim Scenario</option>
                </select>
            </div>
            <div class="form-group">
                <label>Course Call Number / Code</label>
                <input type="text" id="code" value="NURS-402-2026" required>
            </div>
            <div class="form-group">
                <label>Curriculum Title</label>
                <input type="text" id="title" value="Advanced Clinical Nursing Practicum" required>
            </div>
            <div class="form-group">
                <label>Faculty Lead / Author</label>
                <input type="text" id="author" value="Dr. M. Wyn" required>
            </div>
            <div class="form-group">
                <label>Learning Objectives & Modules</label>
                <textarea id="objectives" required>1. Demonstrate rapid patient assessment under emergency protocols.
2. Execute proper sterile field setup and instrument handling.
3. Formulate structured clinical debriefs using standard SBAR formats.</textarea>
            </div>
            <button type="submit" id="submitBtn">Compile, Catalog & Bind Document (.PDF)</button>
        </form>
    </div>

    <!-- 2. CARD CATALOG & STACKS (REGISTRY & VAULT) -->
    <div class="card">
        <h2>Card Catalog Index <span class="badge" style="background: var(--success);">Live Stacks</span></h2>
        <table id="catalogTable">
            <thead>
                <tr>
                    <th>Call Number</th>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Document Vault</th>
                </tr>
            </thead>
            <tbody id="catalogBody">
                <tr id="emptyRow">
                    <td colspan="4" class="empty-catalog">No items cataloged yet. Submit the form to generate a file.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    document.getElementById('curriculumForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = "Binding PDF & Updating Catalog...";

        const code = document.getElementById('code').value;
        const title = document.getElementById('title').value;
        const author = document.getElementById('author').value;
        const objectives = document.getElementById('objectives').value;
        const timestamp = new Date().toLocaleDateString();

        // --- STEP 1: COMPILE PHYSICAL PDF IN MEMORY (THE BINDERY) ---
        const { PDFDocument, rgb, StandardFonts } = PDFLib;
        const pdfDoc = await PDFDocument.create();
        const page = pdfDoc.addPage([600, 750]);
        const fontBold = await pdfDoc.embedFont(StandardFonts.HelveticaBold);
        const fontRegular = await pdfDoc.embedFont(StandardFonts.Helvetica);

        // Header / Institutional Branding
        page.drawRectangle({ x: 0, y: 700, width: 600, height: 50, color: rgb(0.10, 0.21, 0.36) });
        page.drawText('INSTITUTIONAL CURRICULUM REPOSITORY', { x: 30, y: 720, size: 14, font: fontBold, color: rgb(1, 1, 1) });

        // Metadata Fields
        page.drawText(`CALL NUMBER: ${code}`, { x: 30, y: 660, size: 10, font: fontBold, color: rgb(0.1, 0.2, 0.35) });
        page.drawText(`TITLE: ${title}`, { x: 30, y: 640, size: 14, font: fontBold, color: rgb(0.1, 0.1, 0.1) });
        page.drawText(`AUTHOR: ${author}  |  DATE: ${timestamp}`, { x: 30, y: 620, size: 10, font: fontRegular, color: rgb(0.4, 0.4, 0.4) });

        page.drawLine({ start: { x: 30, y: 605 }, end: { x: 570, y: 605 }, thickness: 1, color: rgb(0.8, 0.8, 0.8) });

        // Document Body
        page.drawText('COURSE OBJECTIVES & SEQUENCING:', { x: 30, y: 580, size: 11, font: fontBold, color: rgb(0.1, 0.2, 0.35) });

        const lines = objectives.split('\n');
        let currentY = 555;
        lines.forEach(line => {
            if (line.trim() !== '') {
                page.drawText(line.trim(), { x: 40, y: currentY, size: 10, font: fontRegular, color: rgb(0.2, 0.2, 0.2) });
                currentY -= 20;
            }
        });

        // Footer Stamp
        page.drawText('OFFICIAL RECORD — STORED IN ACADEMIC VAULT', { x: 30, y: 30, size: 8, font: fontBold, color: rgb(0.6, 0.6, 0.6) });

        // Save binary PDF stream
        const pdfBytes = await pdfDoc.save();
        const blob = new Blob([pdfBytes], { type: 'application/pdf' });
        const fileUrl = URL.createObjectURL(blob);
        const fileName = `${code.replace(/[^a-zA-Z0-9]/g, '_')}_Master.pdf`;

        // --- STEP 2: UPDATE CARD CATALOG (THE INDEX) ---
        const emptyRow = document.getElementById('emptyRow');
        if (emptyRow) emptyRow.remove();

        const catalogBody = document.getElementById('catalogBody');
        const newRow = document.createElement('tr');
        newRow.innerHTML = `
            <td><strong>${code}</strong></td>
            <td>${title}</td>
            <td>${author}</td>
            <td><a href="${fileUrl}" download="${fileName}" class="file-link">📄 Download ${fileName}</a></td>
        `;
        catalogBody.prepend(newRow);

        // --- STEP 3: AUTOMATIC FILE DOWNLOAD (TRIGGER THE STACKS) ---
        const downloadAnchor = document.createElement('a');
        downloadAnchor.href = fileUrl;
        downloadAnchor.download = fileName;
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        document.body.removeChild(downloadAnchor);

        // Reset UI
        btn.disabled = false;
        btn.innerText = "Compile, Catalog & Bind Document (.PDF)";
    });
</script>

</body>
</html>
